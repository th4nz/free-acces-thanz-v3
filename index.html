<!-- Supabase & Auth -->
<script type="module">
  import { supabase } from './js/supabase-client.js';
  import { signUp, signIn, signInWithGoogle, getCurrentUser } from './js/auth.js';

  const loginBtn = document.querySelector('#loginView .btn-activation');
  const registerBtn = document.querySelector('#registerView .btn-activation');
  const googleBtn = document.querySelector('#loginView .btn-ghost');

  // Login
  loginBtn.addEventListener('click', async () => {
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    try {
      await signIn(email, password);
      window.location.href = '/fitur.html';
    } catch (err) {
      alert('Login gagal: ' + err.message);
    }
  });

  // Register
  registerBtn.addEventListener('click', async () => {
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    try {
      await signUp(email, password, name);
      alert('Pendaftaran berhasil! Silakan login.');
      switchAuthView('login');
    } catch (err) {
      alert('Register gagal: ' + err.message);
    }
  });

  // Google OAuth
  googleBtn.addEventListener('click', async () => {
    try {
      await signInWithGoogle();
    } catch (err) {
      alert('Google login gagal: ' + err.message);
    }
  });

  // Cek session, jika sudah login redirect ke fitur
  const user = await getCurrentUser();
  if (user) window.location.href = '/fitur.html';
</script>
