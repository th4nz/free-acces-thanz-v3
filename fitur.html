<script type="module">
  import { supabase } from './js/supabase-client.js';
  import { getCurrentUser, signOut } from './js/auth.js';
  import { getCredit, useCredit } from './js/credit.js';

  // Proteksi halaman
  const user = await getCurrentUser();
  if (!user) window.location.href = '/';

  // Ambil credit saat load
  let currentCredit = await getCredit(user.id);
  // Tampilkan credit di UI (misal di header atau tempat lain)
  // Karena UI asli tidak ada indikator credit, kita bisa tambahkan secara halus
  // Misal tambahkan badge di header atau di footer
  const header = document.querySelector('header');
  const creditBadge = document.createElement('div');
  creditBadge.style.cssText = 'font-family: JetBrains Mono; font-size: 12px; color: var(--accent-hi); margin-top: 8px;';
  creditBadge.textContent = `💎 Credit: ${currentCredit}`;
  header.appendChild(creditBadge);

  // Override handleActivation di script asli
  const originalActivate = window.handleActivation;
  window.handleActivation = async function() {
    // Cek credit
    currentCredit = await getCredit(user.id);
    if (currentCredit <= 0) {
      alert('Credit habis. Tunggu reset 3 jam berikutnya.');
      return;
    }
    // Panggil proxy API
    const email = document.getElementById('emailInput').value;
    const magic = document.getElementById('magicInput').value;
    try {
      const res = await fetch(`/api/fitur?action=verif&email=${encodeURIComponent(email)}&url=${encodeURIComponent(magic)}`);
      const data = await res.json();
      if (data.status) {
        // Sukses → kurangi credit
        await useCredit(user.id);
        currentCredit = await getCredit(user.id);
        creditBadge.textContent = `💎 Credit: ${currentCredit}`;
        // Lanjutkan UI sukses (tampilkan success)
        document.getElementById('btnDefault').classList.add('hidden');
        document.getElementById('loaderContainer').classList.add('hidden');
        document.getElementById('btnSuccess').classList.remove('hidden');
      } else {
        alert('Gagal aktivasi: ' + (data.error || data.message));
      }
    } catch (err) {
      alert('Error: ' + err.message);
    }
  };

  // Logout (tambahkan tombol logout di header jika diperlukan)
  // Untuk menjaga UI, kita bisa tambahkan di pojok kanan atas
  const logoutBtn = document.createElement('button');
  logoutBtn.textContent = 'Logout';
  logoutBtn.style.cssText = 'position: fixed; top: 20px; right: 20px; z-index: 999; background: rgba(255,60,60,0.15); border: 1px solid rgba(255,60,60,0.3); color: #ff9e9e; padding: 8px 16px; border-radius: 12px; font-family: Manrope; font-weight: 600; cursor: pointer;';
  logoutBtn.onclick = () => signOut();
  document.body.appendChild(logoutBtn);

  // Hapus event listener lama agar tidak konflik
  // Karena script asli menggunakan fungsi anonim, kita override dengan yang baru
</script>
